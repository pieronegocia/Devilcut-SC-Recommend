name: PinSaver HD (Android APK)

on:
  push:
    paths:
      - "PinSaverHD/**"
      - ".github/workflows/pinsaver-android.yml"
  pull_request:
    paths:
      - "PinSaverHD/**"
      - ".github/workflows/pinsaver-android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: PinSaverHD
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :core:test --stacktrace

      - name: Build APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PinSaverHD-apk
          path: PinSaverHD/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: PinSaverHD/core/build/reports/tests/
